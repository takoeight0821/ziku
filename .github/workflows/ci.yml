name: CI

on:
  push:
    branches: [haskell-rewrite, main]
  pull_request:
    branches: [haskell-rewrite, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Setup Haskell toolchain
        run: mise run setup

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.12.2-${{ hashFiles('ziku.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.12.2-

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all --project-file=cabal.project.ci --test-show-details=direct

      - name: HLint
        run: hlint src/ app/ test/

      - name: Fourmolu
        run: fourmolu --mode check src/ app/ test/

      - name: cabal-gild
        run: cabal-gild --mode check -i ziku.cabal
