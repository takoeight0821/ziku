name: Renovate

on:
  schedule:
    # Run weekly on Mondays at 9:00 UTC (matches update-dependencies.yml)
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: takoeight0821
          repositories: ziku

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@8b7941943a108b2cc2150730963164aa8baeab8c # v44.2.2
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.generate-token.outputs.token }}
        env:
          # Specify which repository to scan
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Enable repository caching for better performance
          RENOVATE_REPOSITORY_CACHE: "enabled"
          # Set log level (use 'debug' for initial troubleshooting)
          LOG_LEVEL: "info"
          # Enable commit signing with GitHub App
          RENOVATE_PLATFORM_COMMIT: "true"
