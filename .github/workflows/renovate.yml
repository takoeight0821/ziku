name: Renovate

on:
  schedule:
    # Run weekly on Mondays at 9:00 UTC (matches update-dependencies.yml)
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: takoeight0821
          repositories: ziku

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.generate-token.outputs.token }}
        env:
          # Specify which repository to scan
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Enable repository caching for better performance
          RENOVATE_REPOSITORY_CACHE: "enabled"
          # Set log level (use 'debug' for initial troubleshooting)
          LOG_LEVEL: "info"
          # Enable commit signing with GitHub App
          RENOVATE_PLATFORM_COMMIT: "enabled"
