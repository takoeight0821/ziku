[env]
_.path = ["~/.ghcup/bin", "~/.cabal/bin"]

[tools]
ghcup = "latest"
chezscheme = "latest"

[tasks.setup]
description = "Install Haskell toolchain and dev tools"
run = """
ghcup install ghc 9.12.2
ghcup set ghc 9.12.2
ghcup install cabal latest
ghcup install hls latest
cabal update
cabal install hlint fourmolu cabal-gild
"""

[tasks."setup:check"]
description = "Verify all tools are available"
run = """
echo "GHC:        $(ghc --version)"
echo "Cabal:      $(cabal --version | head -1)"
echo "HLS:        $(haskell-language-server-wrapper --version)"
echo "HLint:      $(hlint --version)"
echo "Fourmolu:   $(fourmolu --version)"
echo "cabal-gild: $(cabal-gild --version)"
echo "Chez:       $(scheme --version 2>&1)"
"""

[tasks.build]
description = "Build the project"
run = "cabal build all"

[tasks.test]
description = "Run all tests"
run = "cabal test all --test-show-details=direct"

[tasks."test:accept"]
description = "Run tests and update golden files"
run = "cabal test all --test-option=--accept"

[tasks.fmt]
description = "Format all Haskell source + cabal file"
run = """
fourmolu --mode inplace src/ app/ test/
cabal-gild --mode format --io ziku.cabal
"""

[tasks.lint]
description = "Run HLint on all source"
run = "hlint src/ app/ test/"

[tasks.check]
description = "CI-equivalent check (format + lint + build + test)"
run = """
fourmolu --mode check src/ app/ test/
cabal-gild --mode check -i ziku.cabal
hlint src/ app/ test/
cabal test all --project-file=cabal.project.ci --test-show-details=direct
"""

[tasks.repl]
description = "Start Ziku REPL"
run = "cabal run ziku"

[tasks.clean]
description = "Clean build artifacts"
run = "cabal clean"
